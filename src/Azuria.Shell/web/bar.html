<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azuria — barre</title>
  <link rel="stylesheet" href="encre.css">
  <style>
    /* Barre pleine largeur (DA §9). La fenêtre glisse depuis le haut ; ici tout est fixe, rien ne
       bouge à l'intérieur : groupes aux extrémités, horloge au centre. */

    body { position: relative; }

    /* Le verre : voile translucide + liseré haut/gauche. L'arrondi est fait UNIQUEMENT par la
       fenêtre (compositeur DWM) : bord franc ici, pour que l'arrondi intérieur = extérieur. */
    .glass {
      position: fixed;
      inset: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top-color: var(--rim);
      border-left-color: var(--rim);
    }

    .bar { position: absolute; inset: 0; }

    .group {
      position: absolute;
      top: 0; bottom: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 0 12px;
    }
    .group.left { left: 0; }
    .group.right { right: 0; }

    .sep { width: 1px; height: 20px; background: var(--border-strong); }

    .icon-btn {
      display: grid; place-items: center;
      height: 28px; min-width: 28px; padding: 0 8px;
      border-radius: var(--r-icon);
      color: var(--text-3);
      line-height: 1; /* colle le glyphe au centre de sa boîte (métriques Gothic A1) */
      transition: background var(--dur-hover) var(--ease-in),
                  color var(--dur-hover) var(--ease-in);
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .azuria { font-weight: 700; color: var(--text); font-size: 14px; }

    .desk {
      height: 28px; min-width: 28px; padding: 0 10px;
      display: grid; place-items: center;
      border-radius: var(--r-pill);
      color: var(--text-2); font-weight: 600;
      line-height: 1; /* centre le chiffre dans sa boîte (métriques Gothic A1) */
      transition: background var(--dur-hover) var(--ease-in),
                  color var(--dur-hover) var(--ease-in);
    }
    .desk:hover { background: var(--hover); color: var(--text); }
    .desk.active { background: var(--accent-soft); color: var(--accent); }

    /* Horloge, centrée (ne bouge jamais). */
    .clock {
      position: absolute;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: flex; align-items: baseline; gap: 8px;
      padding: 0 12px; height: 28px; border-radius: var(--r-icon);
      white-space: nowrap;
      transition: background var(--dur-hover) var(--ease-in);
    }
    .clock:hover { background: var(--hover); }
    .clock .time {
      font-family: var(--font-num); font-weight: 600; font-size: 17px;
      letter-spacing: 0.5px; line-height: 1;
    }
    .clock .date { color: var(--text-3); font-size: 11px; line-height: 1; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  </style>
</head>
<body>
  <div class="glass"></div>
  <div class="bar">
    <!-- Gauche : bouton Azuria + bureaux -->
    <div class="group left">
      <div class="icon-btn azuria" title="Azuria">A</div>
      <div class="desk active">1</div>
      <div class="desk">2</div>
      <div class="desk">3</div>
    </div>

    <!-- Centre : horloge -->
    <div class="clock" id="clock">
      <span class="time" id="time">00:00</span>
      <span class="date" id="date">—</span>
    </div>

    <!-- Droite : état + bouton panneau -->
    <div class="group right">
      <div class="icon-btn"><span class="dot"></span></div>
      <div class="icon-btn"><span class="dot"></span></div>
      <div class="icon-btn"><span class="dot"></span></div>
      <div class="sep"></div>
      <div class="icon-btn" title="Panneau">☰</div>
    </div>
  </div>

  <script>
    // Horloge locale. Le reste (vrais bureaux, état système) viendra du C# plus tard.
    const jours = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
    const mois = ['janv', 'févr', 'mars', 'avr', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];
    function tick() {
      const d = new Date();
      document.getElementById('time').textContent =
        `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      document.getElementById('date').textContent =
        `${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]}`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
