<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azuria — lanceur</title>
  <link rel="stylesheet" href="encre.css">
  <style>
    /* Lanceur (DA §9) : une ligne pleine largeur par appli ou jeu, recherche en bas, contre le cadre
       d'où sort le tiroir. La liste vient du C# (menu Démarrer + jeux Steam, Epic, Riot).
       Commencer par « > » passe aux commandes (« >wallpaper » : les fonds d'écran d'Images\Wallpaper). */
    .launch { display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 14px; }

    /* Le contenu est découpé à la hauteur du verre, et ce découpage suit le verre (même durée, même
       courbe que LauncherWindow) : rien ne dépasse au-dessus pendant que le lanceur grandit. */
    .launch { transition: clip-path 0.28s var(--ease-in); }

    .list {
      position: relative; /* repère des lignes qui partent */
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column; gap: 2px;
    }
    /* Peu de résultats : ils se posent juste au-dessus du champ. */
    .list::before { content: ""; flex: 1 1 auto; }
    .list::-webkit-scrollbar { width: 6px; height: 6px; }
    .list::-webkit-scrollbar-thumb { background: var(--surface-raised); border-radius: 3px; }

    /* Ligne de liste (DA §10) : rayon 10, survol --hover, élément courant --accent-soft. */
    .row {
      display: flex; align-items: center; gap: 12px; flex: 0 0 auto;
      height: 48px; padding: 0 12px; border-radius: 10px;
      transition: background var(--dur-hover) var(--ease-in);
    }
    .row:hover { background: var(--hover); }
    .row.sel { background: var(--accent-soft); }
    .ic { width: 32px; height: 32px; flex: 0 0 auto; object-fit: contain; }
    .ic.letter {
      border-radius: 8px; background: var(--surface-raised); border: 1px solid var(--border);
      display: grid; place-items: center; color: var(--text-2); font-weight: 700; font-size: 14px;
    }
    /* Commande : son icône au trait, 20 dans les listes (DA §10). */
    .ic.glyph {
      border-radius: 8px; background: var(--surface-raised); border: 1px solid var(--border);
      display: grid; place-items: center; color: var(--text-2);
    }
    .ic.glyph .i { width: 20px; height: 20px; }
    .row.sel .ic.glyph { color: var(--accent); }
    /* >wallpaper : une bande de cartes qui défile à l'horizontale, posée contre le champ. Chaque carte
       est une miniature au format de l'écran, son nom, et « Actuel » pour le fond posé. */
    .list.strip {
      flex-direction: row; align-items: flex-end; gap: 6px;
      overflow-x: auto; overflow-y: hidden; padding-bottom: 8px; /* place de la barre de défilement */
    }
    .list.strip::before { display: none; }
    .list.strip .empty { flex: 1 1 auto; }
    .row.card {
      flex-direction: column; align-items: stretch; gap: 6px;
      width: 168px; height: auto; padding: 6px;
    }
    .card .thumb {
      display: block; width: 156px; height: 88px; object-fit: cover;
      border-radius: 6px; border: 1px solid var(--border); background: var(--surface-raised);
    }
    .card .thumb.letter { display: grid; place-items: center; color: var(--text-3); font-weight: 700; }
    .card .txt { padding: 0 2px 2px; }
    .card .name { font-size: 12px; }
    .card .sub { min-height: 13px; }
    .row.cur .sub { color: var(--accent-text); }
    .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .name { font-size: 13px; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.sel .name { color: var(--accent-text); }
    .sub { font-size: 11px; color: var(--text-3); white-space: nowrap; }
    .empty { text-align: center; color: var(--text-3); font-size: 12px; padding: 24px 0; flex: 0 0 auto; }

    /* Mouvement de la liste (DA §11) : seules les lignes qui ne correspondent plus s'effacent, les
       autres glissent jusqu'à leur nouvelle place, les nouvelles apparaissent en fondu. */
    @keyframes row-in { from { opacity: 0; transform: translateY(6px); } }
    .entering { animation: row-in 0.2s var(--ease-in) both; }
    .leaving {
      position: absolute; left: 0; right: 6px; margin: 0;
      pointer-events: none;
      transition: opacity 0.14s var(--ease-out);
      opacity: 0;
    }
    .moving { transition: transform 0.24s var(--ease-in), background var(--dur-hover) var(--ease-in); }

    @media (prefers-reduced-motion: reduce) {
      .launch { transition: none; }
      @keyframes row-in { from { opacity: 0; } }
      .entering { animation: row-in 0.12s linear both; }
      .moving { transition: background var(--dur-hover) var(--ease-in); }
    }

    /* Champ de recherche des panneaux : 36 de haut (DA §10). */
    .search {
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
      height: 36px; padding: 0 12px;
      background: var(--input); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text-3);
      transition: border-color var(--dur-hover) var(--ease-in);
    }
    .search:focus-within { border-color: var(--accent); }
    .search input {
      flex: 1; min-width: 0; background: none; border: 0; outline: none;
      color: var(--text); font: 12px var(--font);
    }
    .search input::placeholder { color: var(--text-3); }
  </style>
</head>
<body>
  <script src="drawer.js"></script>
  <div class="content launch">
    <div class="list" id="list"></div>
    <div class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" placeholder="Rechercher une application ou un jeu, « > » pour les commandes" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <script>
    const view = window.chrome?.webview;
    const q = document.getElementById('q'), list = document.getElementById('list');
    const launchEl = document.querySelector('.launch'), searchEl = document.querySelector('.search');
    const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');

    let apps = null;          // [{ id, name, sub, icon, game, key }]
    let walls = null;         // { folder, missing, items: [{ id, kind, path, name, sub, thumb, cur, key }] }
    let wallsAsked = false;   // liste des fonds redemandée une fois par ouverture
    let previewing = null;    // chemin du fond en aperçu (le C# le retire à la fermeture)
    let previewTimer = 0;
    let shown = [];           // résultats affichés, dans l'ordre
    let sel = 0;
    const nodes = new Map();  // id → ligne : chaque appli garde la sienne d'un filtrage à l'autre

    // Pertinence : début du nom, puis début d'un mot, puis n'importe où, puis le sous-titre (« steam »…).
    function score(a, term) {
      if (!term) return 0;
      if (a.key.startsWith(term)) return 0;
      if (a.key.split(/[\s\-_.:]+/).some(w => w.startsWith(term))) return 1;
      if (a.key.includes(term)) return 2;
      if (norm(a.sub).includes(term)) return 3;
      return -1;
    }

    // Commandes (« > ») : chacune donne sa liste à partir de ce qui suit son nom.
    const glyph = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
    const commands = [
      { id: 'cmd:wallpaper', kind: 'cmd', name: 'wallpaper', sub: "Change le fond d'écran · Images\\Wallpaper",
        glyph: glyph('<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 16l5-4.5 4 3.5 3-2.5 5 4"/><circle cx="15.5" cy="9.5" r="1.5"/>'),
        list: wallpaperList },
      // Commande d'action : pas de liste, Entrée l'exécute (le C# ouvre Windows Terminal, profil Azuria).
      { id: 'cmd:terminal', kind: 'cmd', name: 'terminal', sub: "Ouvre le terminal d'Azuria · Win+T",
        glyph: glyph('<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M7.5 9.5l3 2.5-3 2.5M12.5 15h4"/>'),
        run: 'terminal' },
    ].map(c => ({ ...c, key: c.name }));

    function wallpaperList() {
      if (!wallsAsked) { wallsAsked = true; view?.postMessage('wallpapers'); }
      if (!walls) return { items: [], empty: "Chargement des fonds d'écran…" };
      if (walls.missing) return { items: [], empty: 'Dossier introuvable : ' + walls.folder };
      return { items: walls.items, layout: 'strip',
               empty: walls.items.length ? 'Aucun fond ne correspond' : 'Aucune image dans ' + walls.folder };
    }

    // Ce que la recherche montre : les applis, la liste des commandes, ou la liste d'une commande.
    function source() {
      const raw = q.value;
      if (!raw.startsWith('>')) return { items: apps, term: norm(raw.trim()), empty: 'Aucun résultat' };
      const m = raw.slice(1).match(/^\s*(\S*)\s*(.*)$/s);
      const name = norm(m[1]), cmd = commands.find(c => c.key === name);
      if (cmd?.run) return { items: [cmd], term: '', empty: '' };
      if (cmd) return { term: norm(m[2].trim()), ...cmd.list() };
      return { items: commands, term: name, empty: 'Aucune commande' };
    }

    function rowFor(a) {
      let el = nodes.get(a.id);
      if (el) {
        // Une ligne gardée suit son état (fond posé ou non).
        el.querySelector('.sub').textContent = a.sub;
        el.classList.toggle('cur', !!a.cur);
        return el;
      }
      el = document.createElement('div');
      el.className = a.kind === 'wall' ? 'row card' : 'row';
      el.classList.toggle('cur', !!a.cur);
      el.dataset.id = a.id;
      const ic = a.kind === 'wall'
               ? (a.thumb ? Object.assign(document.createElement('img'), { className: 'thumb', src: a.thumb, alt: '' })
                          : Object.assign(document.createElement('div'), { className: 'thumb letter', textContent: a.name[0] || '?' }))
               : a.glyph ? Object.assign(document.createElement('div'), { className: 'ic glyph', innerHTML: a.glyph })
               : a.icon ? Object.assign(document.createElement('img'), { className: 'ic', src: a.icon, alt: '' })
               : letter(a.name);
      const txt = document.createElement('div');
      txt.className = 'txt';
      txt.append(Object.assign(document.createElement('div'), { className: 'name', textContent: a.name }),
                 Object.assign(document.createElement('div'), { className: 'sub', textContent: a.sub }));
      el.append(ic, txt);
      nodes.set(a.id, el);
      return el;
    }

    function letter(name) {
      return Object.assign(document.createElement('div'), { className: 'ic letter', textContent: name[0] || '?' });
    }

    const empty = Object.assign(document.createElement('div'), { className: 'empty', textContent: 'Aucun résultat' });

    // Filtre la liste en ne touchant qu'à ce qui change (technique « FLIP ») : on note où est chaque
    // ligne, on met la liste à jour, puis chaque ligne restée part de son ancienne place et glisse.
    function render() {
      const src = source();
      if (!src.items) return;   // applis pas encore reçues
      const term = src.term;
      empty.textContent = src.empty;
      const next = src.items.map(a => [score(a, term), a]).filter(([s]) => s >= 0)
                       .sort((x, y) => x[0] - y[0] || x[1].name.localeCompare(y[1].name, 'fr'))
                       .map(([, a]) => a);
      // Bande de fonds d'écran (horizontale) ou liste : un changement de disposition repart de zéro,
      // sans glissé (les places d'avant n'ont plus de sens).
      const strip = src.layout === 'strip';
      if (strip !== list.classList.contains('strip')) {
        for (const el of [...list.children]) {
          el.remove();
          el.classList.remove('leaving', 'entering', 'moving');
          el.style.transform = ''; el.style.top = '';
        }
        list.classList.toggle('strip', strip);
      }
      // Sortie de >wallpaper en cours d'aperçu : le fond d'avant revient.
      if (!strip) cancelPreview(true);
      const fade = !reduced.matches && list.isConnected;
      const animate = fade && !strip; // la bande ne fait que le fondu d'arrivée

      // 1. Avant : position de chaque ligne visible.
      const before = new Map();
      for (const el of list.children)
        if (!el.classList.contains('leaving')) before.set(el, el.getBoundingClientRect().top);

      // 2. Les lignes qui ne correspondent plus restent où elles sont, hors du flux, et s'effacent.
      const keep = new Set(next.map(a => a.id));
      const listTop = list.getBoundingClientRect().top - list.scrollTop;
      for (const [el, top] of before) {
        const gone = el === empty ? next.length > 0 : !keep.has(el.dataset.id);
        if (!gone) continue;
        if (!animate) { el.remove(); continue; }
        el.classList.remove('entering', 'moving', 'sel');
        el.style.transform = '';
        el.style.top = (top - listTop) + 'px';
        el.classList.add('leaving');
        setTimeout(() => { if (el.classList.contains('leaving')) { el.remove(); el.classList.remove('leaving'); el.style.top = ''; } }, 160);
      }

      // 3. La nouvelle liste, dans l'ordre (une ligne qui revenait en s'effaçant est reprise). On ne
      //    déplace une ligne dans la page que si elle n'est pas déjà à sa place : un déplacement
      //    annule ses transitions en cours.
      const wanted = next.length ? next.map(rowFor) : [empty];
      let cursor = list.firstElementChild;
      const skipLeaving = () => { while (cursor && cursor.classList.contains('leaving') && !wanted.includes(cursor)) cursor = cursor.nextElementSibling; };
      for (const el of wanted) {
        const wasLeaving = el.classList.contains('leaving');
        if (wasLeaving) { el.classList.remove('leaving'); el.style.top = ''; }
        if (!before.has(el) || wasLeaving) {
          el.classList.remove('entering');
          if (fade) { void el.offsetWidth; el.classList.add('entering'); }
        }
        skipLeaving();
        if (el === cursor) cursor = cursor.nextElementSibling;
        else list.insertBefore(el, cursor);
      }

      shown = next;
      // Dans la bande, l'élément courant est le fond posé : rien ne change tant qu'on ne bouge pas.
      sel = strip ? Math.max(0, next.findIndex(a => a.cur)) : 0;
      list.scrollTop = 0;
      list.scrollLeft = 0;
      paintSel();
      if (strip && next[sel]) nodes.get(next[sel].id)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      fit();

      // 4. Après : chaque ligne restée repart de son ancienne place et glisse vers la nouvelle.
      if (!animate) return;
      // Place réelle, sans le glissé éventuellement en cours (il reprendra depuis `before`).
      for (const el of wanted) { el.classList.remove('moving'); el.style.transform = ''; }
      for (const el of wanted) {
        if (!before.has(el)) continue;
        const dy = before.get(el) - el.getBoundingClientRect().top;
        if (Math.abs(dy) < 0.5) continue;
        el.classList.remove('moving');
        el.style.transform = `translateY(${dy}px)`;
      }
      void list.offsetHeight; // fixe le point de départ avant de lancer la transition
      for (const el of wanted) {
        if (!el.style.transform) continue;
        el.classList.add('moving');
        el.style.transform = '';
      }
    }

    function paintSel() {
      shown.forEach((a, i) => nodes.get(a.id)?.classList.toggle('sel', i === sel));
    }

    // Hauteur du contenu (marges + résultats + champ), annoncée au C# : le verre se rétracte quand il
    // y a peu de résultats, la hauteur de la fenêtre restant le maximum. Les lignes qui partent ne
    // comptent pas.
    let lastHeight = -1;
    function fit() {
      const cs = getComputedStyle(launchEl), ls = getComputedStyle(list);
      const items = [...list.children].filter(el => !el.classList.contains('leaving'));
      let rows = 0;
      if (list.classList.contains('strip')) {
        // Bande : la carte la plus haute, et la place de la barre de défilement.
        for (const el of items) rows = Math.max(rows, el.offsetHeight);
        rows += parseFloat(ls.paddingTop) + parseFloat(ls.paddingBottom);
      } else {
        for (const el of items) rows += el.offsetHeight;
        rows += Math.max(0, items.length - 1) * parseFloat(ls.rowGap || 0);
      }
      const h = Math.ceil(parseFloat(cs.paddingTop) + rows + parseFloat(cs.rowGap || 0)
                          + searchEl.offsetHeight + parseFloat(cs.paddingBottom));
      if (h === lastHeight) return;
      lastHeight = h;
      view?.postMessage('height:' + h);
      // Mêmes bornes que le C# (64 au moins, la fenêtre au plus) ; le découpage glisse avec le verre.
      const glass = Math.min(Math.max(h, 64), innerHeight);
      launchEl.style.clipPath = `inset(${innerHeight - glass}px 0 0 0)`;
    }

    // Choix d'un élément par l'utilisateur (souris, flèches) : un fond d'écran passe en aperçu.
    function select(i) {
      if (!shown.length) return;
      sel = Math.max(0, Math.min(shown.length - 1, i));
      paintSel();
      nodes.get(shown[sel].id)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      preview(shown[sel]);
    }

    // Aperçu : le fond change sous le lanceur sans rien enregistrer. Un court délai évite de poser
    // chaque fond survolé en balayant la bande.
    function preview(a) {
      clearTimeout(previewTimer);
      if (a?.kind !== 'wall' || a.path === previewing) return;
      previewTimer = setTimeout(() => {
        previewing = a.path;
        view?.postMessage('wallpaper-preview:' + a.path);
      }, 120);
    }

    // Fin de l'aperçu ; avec `revert`, le fond d'avant revient (le C# le fait aussi à la fermeture).
    function cancelPreview(revert) {
      clearTimeout(previewTimer);
      if (previewing && revert) view?.postMessage('wallpaper-revert');
      previewing = null;
    }

    // Entrée ou clic : une commande se complète dans le champ, un fond est posé pour de bon (tous les
    // écrans, tous les bureaux) et le lanceur se range, une appli se lance.
    function launch(i) {
      const a = shown[i];
      if (!a) return;
      if (a.kind === 'cmd' && a.run) view?.postMessage(a.run);
      else if (a.kind === 'cmd') complete(a);
      else if (a.kind === 'wall') {
        cancelPreview(false);
        view?.postMessage('wallpaper:' + a.path);
        view?.postMessage('close');
      }
      else view?.postMessage('launch:' + a.id);
    }

    function complete(cmd) {
      q.value = '>' + cmd.name + ' ';
      q.focus();
      render();
    }

    function setWalls(data) {
      walls = {
        folder: data.folder, missing: data.missing,
        items: data.items.map(w => ({
          id: 'wall:' + w.path, kind: 'wall', path: w.path, name: w.name, thumb: w.thumb, cur: w.current,
          sub: w.current ? 'Actuel' : '', key: norm(w.name),
        })),
      };
      // Une image retirée perd sa ligne ; une image modifiée a une nouvelle miniature.
      for (const [id, el] of nodes) {
        if (!id.startsWith('wall:')) continue;
        const w = walls.items.find(x => x.id === id);
        if (!w || (el.querySelector('img')?.getAttribute('src') ?? '') !== w.thumb) { el.remove(); nodes.delete(id); }
      }
    }

    // Fond posé : seules les lignes changent d'état, la sélection ne bouge pas.
    function markCurrent(paths) {
      if (!walls) return;
      const cur = new Set(paths.map(p => p.toLowerCase()));
      for (const w of walls.items) {
        w.cur = cur.has(w.path.toLowerCase());
        w.sub = w.cur ? 'Actuel' : '';
        if (nodes.has(w.id)) rowFor(w);
      }
    }

    const indexOf = el => shown.findIndex(a => a.id === el?.dataset.id);

    // Fondu d'arrivée terminé : on retire l'animation, sinon elle garde la main sur transform et
    // opacity (une animation CSS passe avant le style de l'élément) et bloque le glissé suivant.
    list.addEventListener('animationend', e => e.target.classList?.remove('entering'));

    q.addEventListener('input', render);
    list.addEventListener('mousemove', e => {
      const i = indexOf(e.target.closest('.row:not(.leaving)'));
      if (i >= 0 && i !== sel) select(i);
    });
    list.addEventListener('click', e => {
      const i = indexOf(e.target.closest('.row:not(.leaving)'));
      if (i >= 0) launch(i);
    });
    // Icône illisible : on garde l'initiale.
    list.addEventListener('error', e => {
      const img = e.target;
      if (img.tagName !== 'IMG') return;
      const name = img.closest('.row')?.querySelector('.name')?.textContent || '?';
      img.replaceWith(img.classList.contains('thumb')
        ? Object.assign(document.createElement('div'), { className: 'thumb letter', textContent: name[0] })
        : letter(name));
    }, true);

    // Bande des fonds : la molette la fait défiler à l'horizontale.
    list.addEventListener('wheel', e => {
      if (!list.classList.contains('strip') || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      list.scrollLeft += e.deltaY;
      e.preventDefault();
    }, { passive: false });

    // Lanceur rangé par un clic ailleurs : un aperçu pas encore parti ne part plus.
    addEventListener('blur', () => clearTimeout(previewTimer));

    addEventListener('keydown', e => {
      const strip = list.classList.contains('strip');
      const page = Math.max(1, strip ? Math.floor(list.clientWidth / 174) : Math.floor(list.clientHeight / 50));
      switch (e.key) {
        case 'Escape': cancelPreview(false); view?.postMessage('close'); break; // range le lanceur ; le C# rend le fond d'avant
        case 'ArrowDown': select(sel + 1); break;
        case 'ArrowUp': select(sel - 1); break;
        case 'ArrowRight': if (!strip) return; select(sel + 1); break;     // ailleurs, le curseur du champ
        case 'ArrowLeft': if (!strip) return; select(sel - 1); break;
        case 'Home': if (!strip) return; select(0); break;
        case 'End': if (!strip) return; select(shown.length - 1); break;
        case 'PageDown': select(sel + page); break;
        case 'PageUp': select(sel - page); break;
        case 'Enter': launch(sel); break;
        case 'Tab': if (shown[sel]?.kind === 'cmd') complete(shown[sel]); break; // complète la commande
        default: return;
      }
      e.preventDefault();
    });

    view?.addEventListener('message', e => {
      // À chaque ouverture : recherche vide, focus dans le champ.
      if (e.data === 'shown') {
        q.value = ''; wallsAsked = false;
        clearTimeout(previewTimer); previewing = null; // l'aperçu d'avant a été retiré à la fermeture
        render(); q.focus(); return;
      }
      if (e.data?.type === 'wallpapers') { setWalls(e.data); if (q.value.startsWith('>')) render(); return; }
      if (e.data?.type === 'wallpaper-current') { markCurrent(e.data.paths); return; }
      if (e.data?.type === 'apps') {
        apps = e.data.items.map(a => ({ ...a, key: norm(a.name) }));
        // Une appli désinstallée perd sa ligne ; une icône changée se redessine.
        for (const [id, el] of nodes) {
          if (id.startsWith('cmd:') || id.startsWith('wall:')) continue; // pas des applis
          const a = apps.find(x => x.id === id);
          const src = el.querySelector('img')?.getAttribute('src') ?? '';
          if (!a || src !== (a.icon || '')) { el.remove(); nodes.delete(id); }
        }
        render();
      }
    });
    view?.postMessage('apps'); // demande la liste
  </script>
</body>
</html>
