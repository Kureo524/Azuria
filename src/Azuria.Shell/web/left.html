<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azuria — barre</title>
  <link rel="stylesheet" href="encre.css">
  <style>
    /* Barre principale verticale (DA §9) : logo, bureaux, heure, état, alimentation. */
    .bar {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 12px 0;
    }
    .spacer { flex: 1 1 auto; }
    .sep { width: 24px; height: 1px; background: var(--border-strong); flex: 0 0 auto; margin: 4px 0; }

    .btn {
      width: 40px; height: 40px; flex: 0 0 auto;
      border-radius: 11px; display: grid; place-items: center;
      color: var(--text-3);
      transition: background var(--dur-hover) var(--ease-in), color var(--dur-hover) var(--ease-in);
    }
    .btn:hover { background: var(--hover); color: var(--text); }
    .btn[hidden] { display: none; } /* sinon display: grid l'emporte (batterie absente d'un PC fixe) */
    .logo { color: var(--text); font-weight: 700; font-size: 17px; line-height: 1; }
    .power:hover { color: var(--danger); } /* l'action destructrice ne prend la couleur qu'au survol */

    /* Bureaux, empilés */
    .desks { display: flex; flex-direction: column; gap: 4px; }
    .desk {
      width: 32px; height: 32px; border-radius: var(--r-pill);
      display: grid; place-items: center;
      color: var(--text-2); font-weight: 600; font-size: 12px; line-height: 1;
      transition: background var(--dur-hover) var(--ease-in), color var(--dur-hover) var(--ease-in);
    }
    .desk:hover { background: var(--hover); color: var(--text); }
    .desk.active { background: var(--accent-soft); color: var(--accent); }

    /* Heure verticale */
    .clock {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      font-family: var(--font-num); font-weight: 600; font-size: 19px; line-height: 1;
      color: var(--text); padding: 4px 0;
    }
    .clock .date { font-family: var(--font); font-weight: 400; font-size: 10px; color: var(--text-3); margin-top: 5px; }

    .status { display: flex; flex-direction: column; gap: 2px; }
    .desk.add { color: var(--text-3); }
    .desk.add .i { width: 14px; height: 14px; }
    .btn.warn { color: var(--warning); }
    .bat { display: flex; flex-direction: column; gap: 1px; height: 46px; }
    .bat .pct { font-family: var(--font-mono); font-size: 9px; line-height: 1; }
    .bat.low { color: var(--warning); }
    .bat.critical { color: var(--danger); }

    /* Applis ouvertes (remplacent la barre des tâches de Windows) */
    .apps {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      flex: 0 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none;
    }
    .apps::-webkit-scrollbar { display: none; }
    .app { position: relative; }
    .app img { width: 24px; height: 24px; }
    .app .initial { font-weight: 600; font-size: 13px; color: var(--text-2); }
    .app.active { background: var(--accent-soft); }
    /* Réglages dépliés sur place, sous leur icône (pas de détour par le panneau droit). */
    .more {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 6px 0; margin: 2px 0; width: 44px; border-radius: 12px;
      background: var(--surface-raised);
    }
    .more[hidden] { display: none; }
    .btn.open { background: var(--hover); color: var(--text); }
    .mini {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--text-3);
      transition: background var(--dur-hover) var(--ease-in), color var(--dur-hover) var(--ease-in);
    }
    .mini[hidden] { display: none; }
    .mini:hover { background: var(--hover); color: var(--text); }
    .mini.on { background: var(--accent-soft); color: var(--accent); }
    .mini.danger:hover, .mini.arm { color: var(--danger); }
    .mini.arm { background: rgba(217, 100, 108, 0.14); }

    /* Curseur vertical (volume) : glisser, ou la molette */
    .vtrack { width: 6px; height: 112px; border-radius: 3px; background: var(--surface-raised); position: relative; cursor: pointer; margin: 8px 0 6px; }
    .vtrack::before { content: ""; position: absolute; inset: -6px -12px; } /* zone de prise plus large */
    .vfill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
    .vfill::after {
      content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    }
    .vol.muted .vfill, .vol.muted .vfill::after { background: var(--text-3); }
    .vval {
      font-family: var(--font-num); font-weight: 600; font-size: 13px; line-height: 1; color: var(--text-2);
      padding: 5px 4px; border-radius: 7px; cursor: pointer;
    }
    .vval:hover { background: var(--hover); color: var(--text); }
    .vol.muted .vval { color: var(--text-3); }

    .app.active::before {           /* repère de l'appli au premier plan */
      content: ''; position: absolute; left: -4px; top: 12px; bottom: 12px;
      width: 3px; border-radius: 2px; background: var(--accent);
    }
  </style>
</head>
<body>
  <script src="drawer.js"></script>
  <div class="content bar">
    <div class="btn logo" id="logo">A</div>
    <div class="sep"></div>

    <div class="desks" id="desks"></div>

    <div class="sep" id="apps-sep" hidden></div>
    <div class="apps" id="apps"></div>

    <div class="spacer"></div>

    <div class="clock">
      <span id="hh">00</span><span id="mm">00</span>
      <span class="date" id="date">—</span>
    </div>

    <div class="sep"></div>

    <div class="status" id="status">
      <div class="btn" id="st-net" data-more="more-net"></div>
      <div class="more" id="more-net" hidden>
        <div class="mini" id="t-wifi" data-t="wifi" title="Wi-Fi" hidden><svg class="i" viewBox="0 0 24 24"><path d="M3 9.5a14 14 0 0 1 18 0"/><path d="M6 13a9.5 9.5 0 0 1 12 0"/><path d="M9 16.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="0.9" fill="currentColor" stroke="none"/></svg></div>
        <div class="mini" id="t-bluetooth" data-t="bluetooth" title="Bluetooth" hidden><svg class="i" viewBox="0 0 24 24"><path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/></svg></div>
      </div>
      <div class="btn" id="st-snd" data-more="more-snd"></div>
      <div class="more vol" id="more-snd" hidden>
        <div class="vtrack" id="vtrack"><div class="vfill" id="vfill"></div></div>
        <div class="vval" id="vval" title="Couper / rétablir le son">—</div>
      </div>
      <div class="btn bat" id="st-bat" hidden></div>
    </div>

    <div class="btn power" id="power" data-more="more-power" title="Session">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M7 6.5a7.5 7.5 0 1 0 10 0"/></svg>
    </div>
    <div class="more" id="more-power" hidden>
      <div class="mini" data-a="lock" title="Verrouiller"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></div>
      <div class="mini" data-a="sleep" title="Mettre en veille"><svg class="i" viewBox="0 0 24 24"><path d="M19 14.5A8 8 0 0 1 9.5 5a8 8 0 1 0 9.5 9.5z"/></svg></div>
      <div class="mini danger" data-a="signout" title="Se déconnecter (cliquer deux fois)" data-confirm><svg class="i" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg></div>
      <div class="mini danger" data-a="restart" title="Redémarrer (cliquer deux fois)" data-confirm><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4.5v4h-4"/></svg></div>
      <div class="mini danger" data-a="shutdown" title="Éteindre (cliquer deux fois)" data-confirm><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M7 6.5a7.5 7.5 0 1 0 10 0"/></svg></div>
      <div class="mini" data-a="quit" title="Quitter Azuria"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
    </div>
  </div>

  <script>
    const send = m => window.chrome?.webview?.postMessage(m);
    const svg = body => `<svg class="i" viewBox="0 0 24 24">${body}</svg>`;

    // Bureaux virtuels de Windows : un clic y va, « + » en crée un (géré par le C#, BarFeed).
    const desksEl = document.getElementById('desks');
    desksEl.addEventListener('click', e => {
      const d = e.target.closest('.desk');
      if (d) send(d.dataset.i === 'new' ? 'desk:new' : 'desk:' + d.dataset.i);
    });
    function renderDesks(d) {
      let html = '';
      for (let i = 0; i < d.count; i++) html += `<div class="desk${i === d.current ? ' active' : ''}" data-i="${i}">${i + 1}</div>`;
      html += `<div class="desk add" data-i="new">${svg('<path d="M12 7v10M7 12h10"/>')}</div>`;
      desksEl.innerHTML = html;
    }
    renderDesks({ count: 1, current: 0 });

    // Icônes d'état : réseau, son, batterie. Un clic déplie le réglage sous l'icône, sur place
    // (Wi-Fi et Bluetooth, volume, actions de session) : rien ne renvoie au panneau droit.
    const NET = {
      none: '<path d="M3 9.5a14 14 0 0 1 18 0"/><path d="M6 13a9.5 9.5 0 0 1 12 0"/><path d="M4 4l16 16"/>',
      ethernet: '<rect x="8" y="3.5" width="8" height="6" rx="1"/><path d="M12 9.5v4M5 20.5v-4h14v4M12 13.5v7"/>',
      wifi: s => `<path d="M3 9.5a14 14 0 0 1 18 0"${s < 75 ? ' opacity="0.3"' : ''}/><path d="M6 13a9.5 9.5 0 0 1 12 0"${s < 45 ? ' opacity="0.3"' : ''}/><path d="M9 16.5a5 5 0 0 1 6 0"${s < 20 ? ' opacity="0.3"' : ''}/><circle cx="12" cy="19.5" r="0.9" fill="currentColor" stroke="none"/>`,
    };
    const SND = {
      off: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
      low: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/>',
      high: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/>',
    };
    function battery(pct, charging) {
      const w = Math.max(1, Math.round(11 * pct / 100));
      return `<rect x="3" y="7.5" width="16" height="9" rx="2"/><path d="M21 11v2"/>` +
             `<rect x="5" y="9.5" width="${w}" height="5" rx="0.8" fill="currentColor" stroke="none"/>` +
             (charging ? '<path d="M12.5 5l-3 7h4l-3 7" stroke-width="1.4"/>' : '');
    }
    function renderStatus(s) {
      renderDesks(s.desks);
      const net = document.getElementById('st-net');
      net.innerHTML = svg(s.net.kind === 'wifi' ? NET.wifi(s.net.signal) : NET[s.net.kind] || NET.none);
      net.classList.toggle('warn', s.net.kind === 'none');
      net.title = s.net.name || (s.net.kind === 'none' ? 'Hors ligne' : '');
      for (const k of ['wifi', 'bluetooth']) {
        const t = document.getElementById('t-' + k);
        t.hidden = s[k] == null;
        t.classList.toggle('on', s[k] === true);
      }
      const v = s.volume;
      const snd = document.getElementById('st-snd');
      snd.innerHTML = svg(v == null || s.muted || v === 0 ? SND.off : v < 50 ? SND.low : SND.high);
      snd.title = v == null ? 'Aucune sortie audio' : s.muted ? 'Son coupé' : v + ' %';
      if (v != null) setVolume(v, s.muted);
      const bat = document.getElementById('st-bat');
      bat.hidden = s.battery == null;
      if (s.battery != null) {
        bat.innerHTML = svg(battery(s.battery, s.charging)) + `<span class="pct">${s.battery}</span>`;
        bat.classList.toggle('low', !s.charging && s.battery <= 20);
        bat.classList.toggle('critical', !s.charging && s.battery <= 10);
      }
    }
    // Déplier / replier : un seul réglage ouvert à la fois.
    document.querySelectorAll('[data-more]').forEach(b => b.addEventListener('click', () => {
      const target = document.getElementById(b.dataset.more), open = target.hidden;
      document.querySelectorAll('[data-more]').forEach(o => {
        document.getElementById(o.dataset.more).hidden = true;
        o.classList.remove('open');
      });
      disarm();
      target.hidden = !open;
      b.classList.toggle('open', open);
    }));
    document.getElementById('more-net').addEventListener('click', e => {
      const t = e.target.closest('.mini');
      if (t) send('toggle:' + t.dataset.t);
    });

    // Volume : curseur vertical (glisser), molette sur l'icône ou le curseur, clic sur la valeur =
    // couper / rétablir. Pendant le geste, les valeurs reçues du C# sont ignorées.
    const vtrack = document.getElementById('vtrack'), vol = document.getElementById('more-snd');
    const vfill = document.getElementById('vfill'), vval = document.getElementById('vval');
    let volume = 0, muted = false, dragging = false, lastSent = 0;
    function drawVolume() {
      vol.classList.toggle('muted', muted);
      vfill.style.height = volume + '%';
      vval.textContent = muted ? 'muet' : volume;
    }
    function setVolume(v, m) {
      muted = !!m;
      if (!dragging) volume = v;
      drawVolume();
    }
    function applyVolume(v, force) {
      volume = Math.max(0, Math.min(100, Math.round(v)));
      drawVolume();
      const now = performance.now();
      if (force || now - lastSent > 40) { lastSent = now; send('volume:' + volume); } // ~25 par seconde au plus
    }
    const vat = e => { const r = vtrack.getBoundingClientRect(); return Math.max(0, Math.min(1, (r.bottom - e.clientY) / r.height)) * 100; };
    vtrack.addEventListener('pointerdown', e => { dragging = true; vtrack.setPointerCapture(e.pointerId); applyVolume(vat(e), true); });
    vtrack.addEventListener('pointermove', e => { if (dragging) applyVolume(vat(e)); });
    vtrack.addEventListener('pointerup', e => { if (dragging) { applyVolume(vat(e), true); dragging = false; } });
    for (const el of [vol, document.getElementById('st-snd')])
      el.addEventListener('wheel', e => { e.preventDefault(); applyVolume(volume + (e.deltaY < 0 ? 5 : -5), true); }, { passive: false });
    vval.addEventListener('click', () => send('toggle:mute'));

    // Session : les actions qui ferment la session demandent un second clic (3 s pour confirmer).
    let armed = null, armTimer = 0;
    function disarm() { armed?.classList.remove('arm'); armed = null; clearTimeout(armTimer); }
    document.getElementById('more-power').addEventListener('click', e => {
      const b = e.target.closest('.mini');
      if (!b) return;
      if (b.hasAttribute('data-confirm') && armed !== b) {
        disarm();
        armed = b;
        b.classList.add('arm');
        armTimer = setTimeout(disarm, 3000);
        return;
      }
      disarm();
      send('session:' + b.dataset.a);
    });

    // Le logo ouvre / range le lanceur (géré par le C#).
    document.getElementById('logo').addEventListener('click', () => send('launcher'));

    // Applis ouvertes : la liste vient du C# ; un clic active l'appli (ou la réduit si elle est
    // déjà au premier plan, comme la barre des tâches).
    const apps = document.getElementById('apps');
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    window.chrome?.webview?.addEventListener('message', e => {
      const m = e.data;
      if (m?.type === 'status') { renderStatus(m); return; }
      if (m?.type !== 'apps') return;
      document.getElementById('apps-sep').hidden = m.items.length === 0;
      apps.innerHTML = m.items.map(a =>
        `<div class="btn app${a.active ? ' active' : ''}" data-id="${a.id}" title="${esc(a.title)}">` +
        (a.icon ? `<img src="${a.icon}" alt="">` : `<span class="initial">${esc(a.title.slice(0, 1).toUpperCase())}</span>`) +
        `</div>`).join('');
    });
    apps.addEventListener('click', e => {
      const b = e.target.closest('.app');
      if (b) window.chrome?.webview?.postMessage('app:' + b.dataset.id);
    });
    send('apps');
    send('status');

    // Heure verticale + date courte.
    const mois = ['janv', 'févr', 'mars', 'avr', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];
    function tick() {
      const d = new Date();
      document.getElementById('hh').textContent = String(d.getHours()).padStart(2, '0');
      document.getElementById('mm').textContent = String(d.getMinutes()).padStart(2, '0');
      document.getElementById('date').textContent = `${d.getDate()} ${mois[d.getMonth()]}`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
