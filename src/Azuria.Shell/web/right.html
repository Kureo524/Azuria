<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azuria — panneau droit</title>
  <link rel="stylesheet" href="encre.css">
  <style>
    /* Panneau droit (DA §9) : réglages rapides, volume et luminosité, notifications de Windows,
       session. Les données et les actions passent par le C# (RightPanelFeed). */
    .panel { display: flex; flex-direction: column; gap: 14px; padding: 16px 14px 14px; }

    .label { color: var(--text-2); font-weight: 700; font-size: 12px; }
    .head { display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; }
    .mono { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }

    /* Réglages rapides : icône + libellé + état */
    .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 0 0 auto; }
    .toggle {
      display: flex; align-items: center; gap: 10px; min-width: 0;
      height: 52px; padding: 0 12px; border-radius: 12px;
      background: var(--surface-raised); border: 1px solid var(--border); color: var(--text-2);
      transition: background var(--dur-hover) var(--ease-in), color var(--dur-hover) var(--ease-in),
                  opacity var(--dur-hover) var(--ease-in);
    }
    .toggle:hover { background: var(--hover); color: var(--text); }
    .toggle.on { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
    .toggle.none { opacity: 0.35; pointer-events: none; }
    .toggle .t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .toggle .n { font-size: 12px; font-weight: 600; color: var(--text); }
    .toggle .s { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Curseurs : bouton-icône + piste + valeur */
    .slider { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    .slider[hidden] { display: none; }
    .ibtn {
      width: 28px; height: 28px; border-radius: 8px; flex: 0 0 auto; display: grid; place-items: center;
      color: var(--text-2); transition: background var(--dur-hover) var(--ease-in), color var(--dur-hover) var(--ease-in);
    }
    .ibtn:hover { background: var(--hover); color: var(--text); }
    .ibtn.off { color: var(--text-3); }
    .track { flex: 1 1 auto; height: 6px; border-radius: 3px; background: var(--surface-raised); position: relative; cursor: pointer; }
    .track::before { content: ""; position: absolute; inset: -8px 0; } /* zone de prise plus haute */
    .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
    .fill::after {
      content: ''; position: absolute; right: -6px; top: 50%; transform: translateY(-50%);
      width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    }
    .slider.muted .fill, .slider.muted .fill::after { background: var(--text-3); }
    .val { width: 34px; text-align: right; flex: 0 0 auto; }

    /* Notifications, groupées par appli */
    .notices { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .notices::-webkit-scrollbar { width: 6px; }
    .notices::-webkit-scrollbar-thumb { background: var(--surface-raised); border-radius: 3px; }
    .group { display: flex; flex-direction: column; gap: 6px; }
    .ghead { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 11px; font-weight: 600; }
    .ghead img, .ghead .dot { width: 16px; height: 16px; border-radius: 4px; flex: 0 0 auto; }
    .ghead .dot { background: var(--surface-raised); }
    .card {
      position: relative; display: flex; flex-direction: column; gap: 3px; padding: 10px 30px 10px 12px;
      border-radius: 12px; background: var(--surface-raised); border: 1px solid var(--border);
      animation: in 0.2s var(--ease-in) both;
    }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
    .card .title { font-size: 12px; font-weight: 700; color: var(--text); }
    .card .text { font-size: 11px; color: var(--text-2); white-space: pre-line;
                  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card .when { margin-top: 2px; }
    .card .x {
      position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 6px;
      display: grid; place-items: center; color: var(--text-3); opacity: 0;
      transition: opacity var(--dur-hover) var(--ease-in), background var(--dur-hover) var(--ease-in);
    }
    .card:hover .x { opacity: 1; }
    .card .x:hover { background: var(--hover); color: var(--text); }
    .card .x .i { width: 12px; height: 12px; }
    .empty { color: var(--text-3); font-size: 11px; text-align: center; padding: 24px 0; }

    .clear {
      height: 24px; padding: 0 10px; border-radius: 8px; font: 11px var(--font);
      background: var(--surface-raised); border: 1px solid var(--border); color: var(--text-2);
      transition: background var(--dur-hover) var(--ease-in), color var(--dur-hover) var(--ease-in);
    }
    .clear:hover { background: var(--hover); color: var(--text); }
    .clear[hidden] { display: none; }

    /* Session */
    .session { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
    .srow { display: flex; justify-content: space-between; }
    .sbtn {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--text-2);
      transition: background var(--dur-hover) var(--ease-in), color var(--dur-hover) var(--ease-in);
    }
    .sbtn:hover { background: var(--hover); color: var(--text); }
    .sbtn.danger:hover, .sbtn.arm { color: var(--danger); }
    .sbtn.arm { background: rgba(217, 100, 108, 0.14); }
    .shint { height: 14px; text-align: center; font-size: 11px; color: var(--text-3); }
    .shint.arm { color: var(--danger); }
  </style>
</head>
<body>
  <script src="drawer.js"></script>
  <div class="content panel">
    <div class="label">Réglages rapides</div>
    <div class="quick">
      <div class="toggle" id="t-wifi" data-t="wifi">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 9.5a14 14 0 0 1 18 0"/><path d="M6 13a9.5 9.5 0 0 1 12 0"/><path d="M9 16.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="0.9" fill="currentColor" stroke="none"/></svg>
        <div class="t"><span class="n">Wi-Fi</span><span class="s">—</span></div>
      </div>
      <div class="toggle" id="t-bluetooth" data-t="bluetooth">
        <svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>
        <div class="t"><span class="n">Bluetooth</span><span class="s">—</span></div>
      </div>
      <div class="toggle" id="t-mic" data-t="mic">
        <svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        <div class="t"><span class="n">Micro</span><span class="s">—</span></div>
      </div>
      <div class="toggle" id="t-game" data-t="game">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="5"/><path d="M8 10v4M6 12h4"/><circle cx="16" cy="11" r="0.9" fill="currentColor" stroke="none"/><circle cx="17.5" cy="13.5" r="0.9" fill="currentColor" stroke="none"/></svg>
        <div class="t"><span class="n">Mode jeu</span><span class="s">—</span></div>
      </div>
    </div>

    <div class="slider" id="s-volume">
      <div class="ibtn" id="mute"></div>
      <div class="track"><div class="fill"></div></div>
      <span class="mono val">—</span>
    </div>
    <div class="slider" id="s-brightness" hidden>
      <div class="ibtn" style="pointer-events:none"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></div>
      <div class="track"><div class="fill"></div></div>
      <span class="mono val">—</span>
    </div>

    <div class="head">
      <div class="label">Notifications</div>
      <button class="clear" id="clear" hidden>Tout effacer</button>
    </div>
    <div class="notices" id="notices"><div class="empty">Chargement…</div></div>

    <div class="session">
      <div class="srow" id="srow">
        <div class="sbtn" data-a="lock" data-h="Verrouiller"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></div>
        <div class="sbtn" data-a="sleep" data-h="Mettre en veille"><svg class="i" viewBox="0 0 24 24"><path d="M19 14.5A8 8 0 0 1 9.5 5a8 8 0 1 0 9.5 9.5z"/></svg></div>
        <div class="sbtn danger" data-a="signout" data-h="Se déconnecter" data-confirm><svg class="i" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg></div>
        <div class="sbtn danger" data-a="restart" data-h="Redémarrer" data-confirm><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4.5v4h-4"/></svg></div>
        <div class="sbtn danger" data-a="shutdown" data-h="Éteindre" data-confirm><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M7 6.5a7.5 7.5 0 1 0 10 0"/></svg></div>
        <div class="sbtn" data-a="quit" data-h="Quitter Azuria"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      </div>
      <div class="shint" id="shint"></div>
    </div>
  </div>

  <script>
    const view = window.chrome?.webview;
    const $ = id => document.getElementById(id);
    const send = m => view?.postMessage(m);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const svg = body => `<svg class="i" viewBox="0 0 24 24">${body}</svg>`;

    // --- réglages rapides ---
    function toggle(id, on, sub) {
      const el = $(id);
      el.classList.toggle('none', on == null);
      el.classList.toggle('on', !!on);
      el.querySelector('.s').textContent = sub;
    }
    document.querySelectorAll('.toggle').forEach(t => t.addEventListener('click', () => send('toggle:' + t.dataset.t)));

    // --- curseurs : glisser sur la piste ; pendant le geste, les valeurs reçues sont ignorées ---
    function slider(id, onChange) {
      const el = $(id), track = el.querySelector('.track');
      let dragging = false, last = 0;
      const at = e => { const r = track.getBoundingClientRect(); return Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 100); };
      const apply = (v, force) => {
        show(el, v);
        const now = performance.now();
        if (force || now - last > 40) { last = now; onChange(v); }  // ~25 réglages par seconde au plus
      };
      track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); apply(at(e), true); });
      track.addEventListener('pointermove', e => { if (dragging) apply(at(e)); });
      track.addEventListener('pointerup', e => { if (dragging) { dragging = false; apply(at(e), true); } });
      el.addEventListener('wheel', e => { e.preventDefault(); const v = Math.max(0, Math.min(100, (el.value ?? 0) + (e.deltaY < 0 ? 5 : -5))); apply(v, true); }, { passive: false });
      return { set: v => { if (!dragging) show(el, v); } };
    }
    function show(el, v) {
      el.value = v;
      el.querySelector('.fill').style.width = v + '%';
      el.querySelector('.val').textContent = v + ' %';
    }
    const volume = slider('s-volume', v => send('volume:' + v));
    const brightness = slider('s-brightness', v => send('brightness:' + v));
    $('mute').addEventListener('click', () => send('toggle:mute'));

    const SPEAKER = {
      off: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
      low: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/>',
      high: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/>',
    };

    function renderQuick(q) {
      toggle('t-wifi', q.wifi, q.wifi == null ? 'Absent' : q.wifi ? (q.wifiName || 'Non connecté') : 'Éteint');
      toggle('t-bluetooth', q.bluetooth, q.bluetooth == null ? 'Absent' : q.bluetooth ? 'Activé' : 'Éteint');
      toggle('t-mic', q.mic, q.mic == null ? 'Absent' : q.mic ? 'Actif' : 'Coupé');
      toggle('t-game', q.game, q.game ? 'Activé' : 'Désactivé');

      const vol = $('s-volume');
      vol.classList.toggle('muted', q.muted);
      $('mute').classList.toggle('off', q.muted);
      $('mute').innerHTML = svg(q.muted || q.volume === 0 ? SPEAKER.off : q.volume < 50 ? SPEAKER.low : SPEAKER.high);
      if (q.volume != null) volume.set(q.volume);

      $('s-brightness').hidden = q.brightness == null;
      if (q.brightness != null) brightness.set(q.brightness);
    }

    // --- notifications ---
    function ago(t) {
      const s = Math.max(0, (Date.now() - t) / 1000);
      if (s < 60) return 'à l\'instant';
      if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
      if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
      const d = new Date(t);
      return `${d.getDate()}/${String(d.getMonth() + 1).padStart(2, '0')}`;
    }
    let notices = { access: 'loading', items: [] };
    function renderNotices() {
      const box = $('notices'), n = notices;
      $('clear').hidden = !(n.access === 'ok' && n.items.length);
      if (n.access !== 'ok') {
        box.innerHTML = `<div class="empty">${n.access === 'loading' ? 'Chargement…'
          : n.access === 'denied' ? 'Accès aux notifications refusé dans les paramètres de Windows.'
          : 'Notifications indisponibles.'}</div>`;
        return;
      }
      if (!n.items.length) { box.innerHTML = '<div class="empty">Aucune notification</div>'; return; }
      const groups = new Map();
      for (const it of n.items) { if (!groups.has(it.app)) groups.set(it.app, []); groups.get(it.app).push(it); }
      box.innerHTML = [...groups].map(([app, items]) => `
        <div class="group">
          <div class="ghead">${items[0].icon ? `<img src="${items[0].icon}" alt="">` : '<span class="dot"></span>'}<span>${esc(app || 'Appli')}</span></div>
          ${items.map(it => `<div class="card" data-id="${it.id}">
              <div class="title">${esc(it.title)}</div>
              ${it.body ? `<div class="text">${esc(it.body)}</div>` : ''}
              <div class="mono when">${ago(it.time)}</div>
              <div class="x" title="">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</div>
            </div>`).join('')}
        </div>`).join('');
    }
    $('notices').addEventListener('click', e => {
      const x = e.target.closest('.x');
      if (x) send('notif:remove:' + x.closest('.card').dataset.id);
    });
    $('clear').addEventListener('click', () => send('notif:clear'));
    setInterval(() => { if (notices.items.length) renderNotices(); }, 60000); // « il y a … » avance

    // --- session : les actions qui ferment la session demandent un second clic ---
    const hint = $('shint');
    let armed = null, armTimer = 0;
    function disarm() { armed?.classList.remove('arm'); armed = null; hint.classList.remove('arm'); hint.textContent = ''; }
    $('srow').addEventListener('mouseover', e => {
      const b = e.target.closest('.sbtn');
      if (b && !armed) hint.textContent = b.dataset.h;
    });
    $('srow').addEventListener('mouseleave', () => { if (!armed) hint.textContent = ''; });
    $('srow').addEventListener('click', e => {
      const b = e.target.closest('.sbtn');
      if (!b) return;
      if (b.hasAttribute('data-confirm') && armed !== b) {
        disarm();
        armed = b;
        b.classList.add('arm');
        hint.classList.add('arm');
        hint.textContent = `${b.dataset.h} ? Cliquer à nouveau`;
        clearTimeout(armTimer);
        armTimer = setTimeout(disarm, 3000);
        return;
      }
      disarm();
      send('session:' + b.dataset.a);
    });

    // --- messages du C# ---
    view?.addEventListener('message', e => {
      const m = e.data;
      if (m?.type === 'quick') renderQuick(m);
      else if (m?.type === 'notices') { notices = m; renderNotices(); }
    });
    send('ready');
  </script>
</body>
</html>
